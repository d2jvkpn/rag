app:
  name: rag
  data_dir: "data"
  # Used only by the local JSON store when database.dsn is empty.
  # If omitted, the service falls back to {app.data_dir}/app-state.json.
  state_path: "data/app-state.json"

accounts:
- username: "admin"
  password: "admin123"
  permissions:
  - "view_user_list"
  - "delete_documents"
  - "disable_users"
  - "create_knowledge_bases"

http:
  base_path: ""
  jwt_secret: "change-me-in-production"
  jwt_token_ttl: "8h"
  session_cookie: "rag"
  allow_origins:
  - "*"

# Set database.dsn to enable PostgreSQL. Leave empty to use the JSON store.
database:
  dsn: "postgres://username:password@127.0.0.1:5432/rag?sslmode=disable"

# Set redis.dsn to enable Redis-backed token blacklist and Asynq tasks.
redis:
  dsn: "redis://:xxxxxxxx@127.0.0.1:6379/0"

# OpenAI-compatible embedding endpoint. Leave base_url/api_key empty for Noop.
embedder:
  base_url: "https://api.openai.com/v1"
  api_key: "sk-xxxxxxxx"
  model: "text-embedding-v4"
  batch_size: 10
  # Vector dimension of the embedding model. Used for newly created knowledge bases.
  dim: 1024

# Milvus is enabled only when addr is non-empty. Collections are created from the UI.
milvus:
  addr: "127.0.0.1:19530"
  db: "rag"
  #collections:
  #- collection: public
  #  chunk_size: 800    # optional, default 800
  #  chunk_overlap: 100  # optional, default 100
  #  min_chunks: 2       # optional, default 2 (docs shorter than min_chunks×chunk_size become one chunk)
